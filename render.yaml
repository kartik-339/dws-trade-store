services:
  - type: web
    name: trade-store-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn trade_store.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: trade-store-db
          property: connectionString

databases:
  - name: trade-store-db
    plan: free
    databaseName: trade_store
    user: trade_store